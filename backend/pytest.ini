"""Initialize and run tests"""

import pytest
import sys

def run_tests():
    """Run all tests"""
    args = [
        'tests/',
        '-v',
        '--tb=short',
        '--cov=src',
        '--cov-report=html',
        '--cov-report=term'
    ]
    
    result = pytest.main(args)
    return result

if __name__ == '__main__':
    sys.exit(run_tests())
