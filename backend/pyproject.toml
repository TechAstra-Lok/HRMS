"""Project metadata and setup"""

[tool.poetry]
name = "enterprise-hrms"
version = "1.0.0"
description = "Complete Enterprise HR Management System"
authors = ["HRMS Team <team@hrms.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
Flask = "^2.3.3"
Flask-SQLAlchemy = "^3.1.1"
Flask-Migrate = "^4.0.5"
Flask-CORS = "^4.0.0"
Flask-SocketIO = "^5.3.4"
Flask-JWT-Extended = "^4.5.3"
Flask-Limiter = "^3.3.0"
Flask-Caching = "^2.0.2"
SQLAlchemy = "^2.0.21"
psycopg2-binary = "^2.9.8"
alembic = "^1.12.0"
redis = "^5.0.0"
celery = "^5.3.4"
python-dotenv = "^1.0.0"
bcrypt = "^4.0.1"
cryptography = "^41.0.4"
pytz = "^2023.3"
requests = "^2.31.0"
python-dateutil = "^2.8.2"
Pillow = "^10.0.1"
qrcode = "^7.4.2"
openpyxl = "^3.1.2"
reportlab = "^4.0.4"
Jinja2 = "^3.1.2"
eventlet = "^0.33.3"
gevent = "^23.9.1"
numpy = "^1.24.3"
pandas = "^2.0.3"
scikit-learn = "^1.3.1"
PyPDF2 = "^3.0.1"
python-docx = "^0.8.11"
spacy = "^3.6.1"
pyotp = "^2.9.0"
elasticsearch = "^8.9.0"
pydantic = "^2.4.2"

[tool.poetry.dev-dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
black = "^23.0.0"
isort = "^5.12.0"
flake8 = "^6.0.0"
mypy = "^1.5.0"
bandit = "^1.7.5"
pre-commit = "^3.4.0"
locust = "^2.15.0"

[tool.black]
line-length = 120
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_configs = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --tb=short"
testpaths = ["tests"]
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "performance: performance tests",
    "security: security tests"
]
