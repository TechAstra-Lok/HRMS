apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hrms-ingress
  namespace: hrms
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - hrms.example.com
      secretName: hrms-tls
  rules:
    - host: hrms.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: hrms-backend
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hrms-frontend
                port:
                  number: 80
