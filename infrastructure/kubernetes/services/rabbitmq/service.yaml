apiVersion: v1
kind: Service
metadata:
  name: hrms-rabbitmq
  namespace: hrms
  labels:
    app: hrms-rabbitmq
spec:
  type: ClusterIP
  selector:
    app: hrms-rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
