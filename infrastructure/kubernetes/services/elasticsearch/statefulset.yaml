apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hrms-elasticsearch
  namespace: hrms
  labels:
    app: hrms-elasticsearch
spec:
  serviceName: hrms-elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app: hrms-elasticsearch
  template:
    metadata:
      labels:
        app: hrms-elasticsearch
    spec:
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
          env:
            - name: discovery.type
              value: single-node
            - name: ES_JAVA_OPTS
              value: -Xms512m -Xmx512m
          ports:
            - containerPort: 9200
            - containerPort: 9300
          volumeMounts:
            - name: elasticsearch-data
              mountPath: /usr/share/elasticsearch/data
  volumeClaimTemplates:
    - metadata:
        name: elasticsearch-data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
