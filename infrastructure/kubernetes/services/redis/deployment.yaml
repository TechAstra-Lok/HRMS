apiVersion: apps/v1
kind: Deployment
metadata:
  name: hrms-redis
  namespace: hrms
  labels:
    app: hrms-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hrms-redis
  template:
    metadata:
      labels:
        app: hrms-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
