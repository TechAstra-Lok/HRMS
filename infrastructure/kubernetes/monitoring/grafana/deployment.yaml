apiVersion: apps/v1
kind: Deployment
metadata:
  name: hrms-grafana
  namespace: hrms
  labels:
    app: hrms-grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hrms-grafana
  template:
    metadata:
      labels:
        app: hrms-grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hrms-secrets
                  key: GRAFANA_ADMIN_PASSWORD
          volumeMounts:
            - name: grafana-storage
              mountPath: /var/lib/grafana
      volumes:
        - name: grafana-storage
          emptyDir: {}
