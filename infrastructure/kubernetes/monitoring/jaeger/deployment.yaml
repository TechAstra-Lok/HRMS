apiVersion: apps/v1
kind: Deployment
metadata:
  name: hrms-jaeger
  namespace: hrms
  labels:
    app: hrms-jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hrms-jaeger
  template:
    metadata:
      labels:
        app: hrms-jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.49
          ports:
            - containerPort: 16686
            - containerPort: 14268
