apiVersion: v1
kind: ConfigMap
metadata:
  name: hrms-loki-config
  namespace: hrms
data:
  local-config.yaml: |-
    auth_enabled: false
    server:
      http_listen_port: 3100
    ingester:
      wal:
        enabled: false
    schema_config:
      configs:
        - from: 2020-10-24
          store: filesystem
          object_store: filesystem
          schema: v11
          index:
            prefix: index_
            period: 24h
    storage_config:
      filesystem:
        directory: /loki
    limits_config:
      enforce_metric_name: false
