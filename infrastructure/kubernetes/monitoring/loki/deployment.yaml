apiVersion: apps/v1
kind: Deployment
metadata:
  name: hrms-loki
  namespace: hrms
  labels:
    app: hrms-loki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hrms-loki
  template:
    metadata:
      labels:
        app: hrms-loki
    spec:
      containers:
        - name: loki
          image: grafana/loki:2.9.1
          args:
            - -config.file=/etc/loki/local-config.yaml
          ports:
            - containerPort: 3100
          volumeMounts:
            - name: config
              mountPath: /etc/loki
      volumes:
        - name: config
          configMap:
            name: hrms-loki-config
