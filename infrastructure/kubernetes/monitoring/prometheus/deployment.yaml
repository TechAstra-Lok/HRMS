apiVersion: apps/v1
kind: Deployment
metadata:
  name: hrms-prometheus
  namespace: hrms
  labels:
    app: hrms-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hrms-prometheus
  template:
    metadata:
      labels:
        app: hrms-prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: hrms-prometheus-config
        - name: data
          emptyDir: {}
