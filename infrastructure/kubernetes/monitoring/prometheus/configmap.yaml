apiVersion: v1
kind: ConfigMap
metadata:
  name: hrms-prometheus-config
  namespace: hrms
data:
  prometheus.yml: |-
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
      - job_name: 'hrms-services'
        static_configs:
          - targets: ['hrms-backend:5000', 'hrms-frontend:80', 'hrms-postgres:5432', 'hrms-rabbitmq:5672', 'hrms-redis:6379']
