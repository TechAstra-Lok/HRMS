input {
  beats {
    port => 5044
  }
}
filter {
  if [fields][service] == "hrms" {
    mutate {
      add_field => { "[@metadata][target_index]" => "hrms-%{+YYYY.MM.dd}" }
    }
  }
}
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "%{[@metadata][target_index]}"
  }
}
