name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run backend tests
        run: |
          cd backend
          pytest --maxfail=1 --disable-warnings -q
      - name: Validate no debug statements
        run: |
          set -e
          cd backend
          grep -R --exclude-dir=__pycache__ -n "print(\|debug=True\|console\.log\|Admin@123\|postgres:postgres" .

  build-and-publish:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to registry
        uses: docker/login-action@v5
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push backend image
        run: |
          docker build -f backend/Dockerfile -t ${{ secrets.DOCKER_REGISTRY }}/hrms-backend:${{ github.sha }} backend
          docker push ${{ secrets.DOCKER_REGISTRY }}/hrms-backend:${{ github.sha }}
      - name: Build and push frontend image
        run: |
          docker build -f frontend/Dockerfile -t ${{ secrets.DOCKER_REGISTRY }}/hrms-frontend:${{ github.sha }} frontend
          docker push ${{ secrets.DOCKER_REGISTRY }}/hrms-frontend:${{ github.sha }}
